apiVersion: v1
kind: ConfigMap
metadata:
  name: sbaro-api-config
  namespace: sbaro
data:
  NODE_ENV: "production"
  PORT: "3000"
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_USERNAME: "sbaro"
  DB_DATABASE: "sbaro_db"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  CORS_ORIGIN: "https://sbaro.yourdomain.com"
---
apiVersion: v1
kind: Secret
metadata:
  name: sbaro-api-secret
  namespace: sbaro
type: Opaque
data:
  DB_PASSWORD: c2Jhcm8= # base64 encoded "sbaro"
  JWT_SECRET: c3VwZXJzZWNyZXRqd3RrZXk= # base64 encoded "supersecretjwtkey"
  OPENAI_API_KEY: "" # Add your OpenAI API key here
  ANTHROPIC_API_KEY: "" # Add your Anthropic API key here
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sbaro-api
  namespace: sbaro
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sbaro-api
  template:
    metadata:
      labels:
        app: sbaro-api
    spec:
      containers:
      - name: sbaro-api
        image: sbaro/api:latest
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: sbaro-api-config
        - secretRef:
            name: sbaro-api-secret
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sbaro-api-service
  namespace: sbaro
spec:
  selector:
    app: sbaro-api
  ports:
  - port: 80
    targetPort: 3000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sbaro-api-hpa
  namespace: sbaro
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sbaro-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80