apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sbaro-ingress
  namespace: sbaro
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  tls:
  - hosts:
    - sbaro.yourdomain.com
    - api.sbaro.yourdomain.com
    secretName: sbaro-tls
  rules:
  - host: sbaro.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sbaro-frontend-service
            port:
              number: 80
  - host: api.sbaro.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sbaro-api-service
            port:
              number: 80